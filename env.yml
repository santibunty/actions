name: Environment variables
on: push
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: docker build
      env:
        CONTAINER_REGISTRY: docker.io
        DOCKER_USERNAME: siddharth1
        IMAGE_NAME: github-actions-nginx
      run: echo docker build -t $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
    - name: login 
      env:
        DOCKER_USERNAME: siddharth1
        DOCKER_PASSWORD: s3cUrePaSsw0rd
      run: echo docker login -u $DOCKER_USERNAME -p$DOCKER_PASSWORD
    - name: publish
      env:
        CONTAINER_REGISTRY: docker.io
        DOCKER_USERNAME: siddharth1
        IMAGE_NAME: github-actions-nginx
      run: docker push $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
  
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
    - name: run
      env:
        CONTAINER_REGISTRY: docker.io
        DOCKER_USERNAME: siddharth1
        IMAGE_NAME: github-actions-nginx
      run: docker run -d -p 8080:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest